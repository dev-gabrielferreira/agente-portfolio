[project]
name = "agente-portfolio"
version = "1.0.0"
description = "Agente de desenvolvimento autônomo (Claude Opus + harness) que constrói, publica e mantém projetos de portfólio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["orchestrator*", "jarvis*"]

[tool.setuptools.package-data]
orchestrator = ["templates/*.html", "static/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["harness/project-template", "harness/starters"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "RUF059"]
"jarvis/mcp_server.py" = ["E501"]  # descrições das ferramentas são texto para o modelo
