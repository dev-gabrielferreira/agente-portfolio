# Sobe o agente no VPS. Veja o README, seção "Instalação no VPS".
services:
  agente:
    build: .
    image: agente-portfolio:latest
    container_name: agente
    restart: unless-stopped
    env_file: .env
    volumes:
      - /srv/agente:/srv/agente                      # projetos, banco, logs, segredos, sites do Caddy, skills,
                                                     # home do usuário agent (login do Figma)
      - ./harness:/opt/agente/harness:ro             # editar o harness no repo vale no próximo job
      - /var/run/docker.sock:/var/run/docker.sock    # só o orquestrador (root) usa; o agent não tem acesso
    networks:
      - agente-painel                                # rede só com o Caddy: o agente não enxerga a 'interna'
    mem_limit: 6g
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Jarvis: a central que você usa pelo app do Claude (Code → "Jarvis"), mesmo com o notebook desligado.
  # Login da assinatura feito uma vez: ./scripts/setup-jarvis.sh. Sem Docker, sem .env inteiro (só o
  # que ele precisa), projetos e base de conhecimento montados SOMENTE LEITURA.
  jarvis:
    image: agente-portfolio:latest
    container_name: jarvis
    restart: unless-stopped
    init: true
    depends_on: [agente]
    entrypoint: ["/opt/agente/jarvis/entrypoint.sh"]
    command: ["/opt/agente/jarvis/supervisor.sh"]
    environment:
      AGENTE_API_URL: http://agente:8080/api/v1
      JARVIS_API_TOKEN: ${JARVIS_API_TOKEN:-}          # só o usuário jarvis usa (o lab roda com ambiente limpo)
      LAB_CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}  # token só-modelo das sessões do laboratório
      JARVIS_MODEL: ${JARVIS_MODEL:-claude-opus-5-5}
      JARVIS_NAME: ${JARVIS_NAME:-Jarvis}
      JARVIS_CHANNEL: ${JARVIS_CHANNEL:-0}
      JARVIS_CHANNELS: ${JARVIS_CHANNELS:-}
      JARVIS_LAB_SERVER: ${JARVIS_LAB_SERVER:-1}
      JARVIS_LAB_CAPACITY: ${JARVIS_LAB_CAPACITY:-4}
      JARVIS_LAB_PERMISSION_MODE: ${JARVIS_LAB_PERMISSION_MODE:-acceptEdits}
      JARVIS_BG_PERMISSION_MODE: ${JARVIS_BG_PERMISSION_MODE:-dontAsk}
      JARVIS_CONVERSAS: ${JARVIS_CONVERSAS:-1}                  # uma conversa por projeto no app
      JARVIS_CONVERSAS_MAX: ${JARVIS_CONVERSAS_MAX:-6}          # quantos projetos ao mesmo tempo (os mais recentes)
      JARVIS_CONVERSAS_FIXAS: ${JARVIS_CONVERSAS_FIXAS:-}       # slugs que ficam sempre no ar
      JARVIS_CONVERSAS_CAPACIDADE: ${JARVIS_CONVERSAS_CAPACIDADE:-2}
      ENABLE_CLAUDEAI_MCP_SERVERS: "true"            # conectores do claude.ai só no Jarvis, nunca nos workers
      TZ: ${TZ:-America/Sao_Paulo}
      PYTHONPATH: /opt/agente                        # usa o código montado abaixo (editar o repo vale no restart)
      PYTHONSAFEPATH: "1"                            # python -m nunca importa da pasta atual (onde o jarvis escreve)
    volumes:
      - ./jarvis:/opt/agente/jarvis:ro               # regras, skills e MCP do Jarvis (versão do repositório)
      - ./harness/skills:/opt/agente/harness/skills:ro  # skills do agente, como conhecimento nas conversas
      - /srv/jarvis:/srv/jarvis                      # login do Claude, conversas, memória, laboratório
      - /srv/agente/projects:/srv/projetos:ro
      - /srv/agente/knowledge:/srv/conhecimento:ro
    networks:
      - agente-painel                                # fala com http://agente:8080 (API interna)
    mem_limit: ${JARVIS_MEM_LIMIT:-6g}               # ~300–500 MB por conversa aberta (Jarvis + projetos)
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  agente-painel:
    external: true
