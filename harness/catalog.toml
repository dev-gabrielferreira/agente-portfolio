# Catálogo do harness: skills, plugins e servidores MCP por papel e por stack.
#
# Feedforward sob medida: cada papel (planner, designer, builder, tester, evaluator, security,
# reviewer, retro) recebe só o que ajuda na etapa dele, filtrado pelas tags da stack do projeto.
#
#   roles   = papéis que recebem o item
#   tags    = ["all"] ou tags de stack; o item entra se o projeto tiver ao menos uma delas
#             (ui, react, api, data, llm, auth, realtime, scheduler, mcp, charts, figma)
#   preload = papéis que carregam o conteúdo completo da skill já no início da sessão
#             (os demais veem só nome e descrição e invocam quando precisarem)
#
# Fontes externas ficam fixadas por commit e são baixadas para /srv/agente/vendor na instalação
# (python -m orchestrator.skills sync). Para atualizar: troque o `ref`, rode o sync e rode os testes.

