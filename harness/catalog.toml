# ------------------------------------------------------------------------------------ plugins
# Carregados com --plugin-dir. Trazem hooks, subagentes ou servidores de linguagem (LSP).
[[plugins]]
name = "agente-lsp"          # Pyright + TypeScript: diagnósticos de tipo injetados após cada edição
source = "local"
path = "plugins/agente-lsp"
roles = ["builder", "tester", "reviewer"]

[[plugins]]
name = "security-guidance"   # avisos de padrões perigosos a cada edição + revisão do diff (oficial)
source = "claude-plugins-official"
path = "plugins/security-guidance"
roles = ["builder"]
toggle = "ENABLE_SECURITY_GUIDANCE"

[[plugins]]
name = "pr-review-toolkit"   # subagentes oficiais: silent-failure-hunter, pr-test-analyzer, code-simplifier…
source = "claude-plugins-official"
path = "plugins/pr-review-toolkit"
roles = ["reviewer"]

# ------------------------------------------------------------------------------------ MCP
# scope = "session": o orquestrador passa por --mcp-config em cada sessão.
# scope = "user": registrado uma vez no usuário `agent` (precisa de login/chave); a sessão só
#                 bloqueia quando o papel não pode usar.
# deny  = ferramentas específicas bloqueadas para certos papéis (ex.: builder só lê o Figma).
[mcp.playwright]
scope = "session"
command = "mcp-server-playwright"
args = ["--headless", "--isolated", "--browser", "chromium", "--viewport-size", "1366,900", "--output-dir", ".harness/evidence"]
roles = ["designer", "builder", "tester", "evaluator"]

[mcp.chrome-devtools]
scope = "session"
command = "chrome-devtools-mcp"
args = ["--headless", "--isolated", "--executablePath={chromium}"]
roles = ["evaluator"]

[mcp.shadcn]                     # registro de componentes shadcn/ui (busca, exemplos, comando de add)
scope = "session"
command = "shadcn"                 # instalado na imagem (shadcn@4.21.0)
args = ["mcp"]
roles = ["designer", "builder"]
tags = ["react"]

[mcp.context7]
scope = "user"
url = "https://mcp.context7.com/mcp"
roles = ["planner", "designer", "builder", "tester", "security", "reviewer"]

[mcp.figma]
scope = "user"
url = "https://mcp.figma.com/mcp"
requires = "FIGMA_ENABLED"
roles = ["designer", "builder"]

[mcp.figma.deny]
builder = ["use_figma", "create_new_file", "generate_figma_design", "upload_assets",
           "generate_diagram", "add_code_connect_map", "send_code_connect_mappings",
           "create_generative_plugin", "update_generative_plugin", "create_shader", "update_shader"]
