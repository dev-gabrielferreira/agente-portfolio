[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-playwright>=0.5",
  "hypothesis>=6.100",
  "schemathesis>=4.0",
  "axe-playwright-python>=0.1.4",
  "mutmut>=3.3",
  "pyright>=1.1.380",
  "respx>=0.21",
  "ruff>=0.6",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "mutants", "scripts/test_quality.py"]  # arquivos do harness seguem o lint do harness

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "e2e: ponta a ponta com navegador (tests/e2e; fora do gate rápido)",
  "fuzz: fuzz de contrato da API com Schemathesis (fora do gate rápido)",
  "feature(id): liga o teste a uma feature de .harness/features.json",
]

[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.mutmut]
# regra de negócio mora em app/services: é onde mutation testing dá o sinal mais útil
source_paths = ["app/services"]
# copia o pacote inteiro para a área do mutmut: rotas e configuração precisam existir lá
also_copy = ["app"]
pytest_add_cli_args = ["-m", "not e2e and not fuzz", "-x", "-q", "--ignore=.claude"]
