<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>Entrar · Agente</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="center">
  <form method="post" action="/login" class="card login">
    <div class="brand"><span class="led led-on"></span> agente<span class="dim">/portfólio</span></div>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    <label>Senha <input type="password" name="password" autofocus required autocomplete="current-password"></label>
    <button class="primary">Entrar</button>
  </form>
</body>
</html>
